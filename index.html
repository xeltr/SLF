<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Stadt Land Fluss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --felt: #1e3626;
    --felt-dark: #142519;
    --paper: #f1ead7;
    --paper-edge: #e4dabd;
    --rule: #c9bd9c;
    --ink: #23231e;
    --ink-soft: #55503f;
    --pencil-red: #a83a2c;
    --pencil-blue: #2f4b73;
    --gold: #b8863b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 15% -10%, #274430 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #1a3020 0%, transparent 55%),
      var(--felt);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
    position:relative;
  }
  .app{ width:100%; max-width:480px; }

  .brand{ text-align:center; margin:6px 0 10px; }
  .brand .mark{ display:inline-flex; gap:6px; margin-bottom:10px; }
  .brand .mark span{
    font-family:'Fraunces',serif; font-weight:700; font-size:26px;
    background:var(--paper); color:var(--ink);
    width:38px;height:38px; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.25);
    transform:rotate(var(--r,0deg));
  }
  .brand .mark span:nth-child(1){--r:-6deg}
  .brand .mark span:nth-child(2){--r:4deg}
  .brand .mark span:nth-child(3){--r:-3deg}
  .brand .mark span:nth-child(4){--r:5deg}
  .brand p{ color:#cfdccf; font-size:12.5px; letter-spacing:.04em; margin:0; }

  .conn{ text-align:center; font-size:10.5px; letter-spacing:.05em; margin-bottom:16px; color:#8fae94; }
  .conn.bad{ color:#e2a58f; }
  .conn .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:5px; }

  .paper{
    background:var(--paper);
    border-radius:3px;
    padding:26px 22px;
    box-shadow: 0 1px 0 var(--paper-edge) inset, 0 14px 30px -12px rgba(0,0,0,.55);
    position:relative;
    margin-bottom:16px;
  }
  .paper::before{
    content:"";
    position:absolute; left:0; right:0; top:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--pencil-red) 0 14px, transparent 14px 24px);
    opacity:.55;
    border-radius:3px 3px 0 0;
  }

  h1.title{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 4px; line-height:1.15; }
  .sub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 20px; }

  .setup-banner{
    background:#fdf3e0; border:2px dashed var(--gold); border-radius:4px;
    padding:14px 16px; margin-bottom:16px; font-size:12px; color:var(--ink-soft); line-height:1.6;
  }
  .setup-banner b{ color:var(--ink); }
  .setup-banner code{ background:#fff; padding:1px 5px; border-radius:3px; font-size:11.5px; }
  .setup-banner ol{ margin:8px 0 0; padding-left:18px; }

  label.field-label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-soft); margin:0 0 6px;
  }
  input[type=text]{
    width:100%; border:none; border-bottom:2px solid var(--rule);
    background:transparent; font-family:'Caveat',cursive; font-size:24px;
    color:var(--pencil-blue); padding:4px 2px 8px; outline:none;
  }
  input[type=text]:focus{ border-bottom-color:var(--pencil-blue); }
  input[type=text]::placeholder{ color:#a79e86; font-family:'IBM Plex Mono',monospace; font-size:14px; }
  .field{ margin-bottom:18px; }

  .btn{
    width:100%; border:none; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px;
    letter-spacing:.03em; padding:13px 16px; border-radius:3px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-outline{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
  .btn-stop{ background:var(--pencil-red); color:#fff; }
  .btn-stop:disabled, .btn-primary:disabled{ opacity:.45; cursor:default; }
  .link-btn{
    background:none; border:none; color:var(--pencil-blue); text-decoration:underline;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; cursor:pointer; padding:6px 0;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .chip{
    font-size:12.5px; padding:7px 12px; border-radius:20px; cursor:pointer;
    border:2px solid var(--rule); color:var(--ink-soft); user-select:none;
    background:#fff9ec;
  }
  .chip.on{ border-color:var(--pencil-blue); color:var(--pencil-blue); background:#e4ebf4; font-weight:600; }
  .chip.locked{ opacity:.5; cursor:default; }

  .code-tile{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:18px;
    letter-spacing:.03em; text-align:center; color:var(--ink); word-break:break-all;
    background:#fff9ec; border:2px dashed var(--rule); border-radius:4px;
    padding:16px 10px; margin-bottom:6px; cursor:pointer;
  }
  .code-hint{ text-align:center; color:var(--ink-soft); font-size:11.5px; margin-bottom:18px; }

  .player-row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px dashed var(--rule); font-size:14.5px;
  }
  .player-row:last-child{ border-bottom:none; }
  .dot2{ width:8px; height:8px; border-radius:50%; background:var(--pencil-blue); flex:none; }
  .player-row .host-tag{
    margin-left:auto; font-size:10px; letter-spacing:.06em; color:var(--gold);
    border:1px solid var(--gold); padding:2px 7px; border-radius:10px;
  }

  .letter-wrap{ display:flex; justify-content:center; margin:4px 0 22px; }
  .letter-tile{
    width:96px; height:96px; background:#fffdf6; border:3px solid var(--ink);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:56px; color:var(--ink);
    box-shadow:0 6px 0 rgba(0,0,0,.2); transform:rotate(-3deg);
  }

  table.cats{ width:100%; border-collapse:collapse; margin-bottom:18px; }
  table.cats td{ padding:9px 0; border-bottom:1px dashed var(--rule); vertical-align:bottom; }
  table.cats td.lbl{
    width:34%; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); padding-right:10px; padding-bottom:12px;
  }
  table.cats input{ font-size:22px; padding-bottom:4px; }
  .field-status{ font-size:10.5px; min-height:13px; margin-top:2px; color:var(--ink-soft); }

  .status-line{ text-align:center; color:var(--ink-soft); font-size:13px; margin:4px 0 18px; }
  .waitdots span{ animation: blink 1.4s infinite; }
  .waitdots span:nth-child(2){ animation-delay:.2s; }
  .waitdots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  .result-row{ display:flex; align-items:baseline; gap:10px; padding:11px 0; border-bottom:1px dashed var(--rule); }
  .result-row:last-child{ border-bottom:none; }
  .rank{ font-family:'Fraunces',serif; font-weight:700; font-size:18px; width:22px; color:var(--ink-soft); }
  .result-row.first .rank{ color:var(--pencil-red); }
  .rname{ flex:1; font-size:15px; }
  .result-row.first .rname{ font-weight:600; }
  .rpts{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--pencil-blue); }
  .breakdown{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  .error{ color:var(--pencil-red); font-size:12.5px; margin:-8px 0 14px; }
  .foot-note{ text-align:center; color:#a9c0ac; font-size:11px; margin-top:4px; }
</style>
</head>

<script>
/* =========================================================
   CLOUD-SPEICHER: Firebase Realtime Database
   -----------------------------------------------------------
   Läuft auf JEDEM Hosting (GitHub Pages, eigener Server, ...),
   da es sich um einen echten, unabhängigen Cloud-Dienst
   handelt - kein Claude-only API mehr.

   EINRICHTUNG (einmalig, kostenlos, ~2 Minuten):
   1. https://console.firebase.google.com öffnen, neues Projekt anlegen.
   2. Im Menü "Build" -> "Realtime Database" -> "Datenbank erstellen".
      Standort wählen, Regeln zunächst im Testmodus lassen.
   3. Unter Projekteinstellungen (Zahnrad oben links) -> "Allgemein"
      -> "Meine Apps" -> Web-App (</>) hinzufügen.
   4. Das angezeigte firebaseConfig-Objekt hier unten einfügen.
   5. In der Realtime Database unter "Regeln" folgendes eintragen
      und veröffentlichen (offen für dieses Party-Spiel, keine
      Logins nötig - für Produktivsysteme mit echten Nutzerdaten
      NICHT geeignet):
         {
           "rules": { ".read": true, ".write": true }
         }
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCUINc4eU2nQOgco_am76bDQer9WektM3s",
  authDomain: "fir-l-f-d400d.firebaseapp.com",
  databaseURL: "https://fir-l-f-d400d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fir-l-f-d400d",
  storageBucket: "fir-l-f-d400d.firebasestorage.app",
  messagingSenderId: "52031477240",
  appId: "1:52031477240:web:8248ad3dfca0f5746c320d"
};

const configReady = firebaseConfig.apiKey !== "DEIN_API_KEY" && !!firebaseConfig.databaseURL;
let db = null;
if(configReady){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}
function roomRef(path){ return db.ref('rooms/' + state.roomId + (path ? '/' + path : '')); }

/* =========================================================
   PRÜFUNG DER ANTWORTEN
   -----------------------------------------------------------
   - Standard-Kategorien (Stadt, Land, Fluss, Tier, Vorname,
     Beruf, Pflanze, Farbe, Marke) werden GAR NICHT per KI
     geprüft, sondern gegen eine fest eingebaute Wortliste
     (siehe LOCAL_DB unten) - schnell, kostenlos, offline.
     Die Listen sind kuratiert, aber nicht 100% vollständig;
     fehlende Wörter kannst du direkt unten in den Arrays
     ergänzen.
   - Nur bei SELBST HINZUGEFÜGTEN Kategorien (über "+ eigene
     Kategorie") gibt es keine feste Liste - dafür wird die
     ChatGPT-API (OpenAI) gefragt, ob die Antwort passt.

   EINRICHTUNG (nur nötig, wenn eigene Kategorien genutzt
   werden sollen, ~1 Minute):
   1. https://platform.openai.com/api-keys öffnen, Key erstellen.
   2. Wert unten bei apiKey einsetzen.
   3. WICHTIG: Da dies eine rein clientseitige, öffentlich gehostete
      Seite ist, liegt der Key für jeden im Quelltext sichtbar offen.
      Nur für private Runden geeignet - setze in der OpenAI-Console
      unbedingt ein Ausgabenlimit, um Missbrauch zu begrenzen.
   ========================================================= */
const aiConfig = {
  apiKey: "DEIN_OPENAI_API_KEY",
};
const aiConfigured = aiConfig.apiKey && aiConfig.apiKey !== "DEIN_OPENAI_API_KEY";

async function callChatGPT(systemPrompt, userPrompt, maxTokens){
  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + aiConfig.apiKey,
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      max_tokens: maxTokens,
      messages: [
        {role:'system', content: systemPrompt},
        {role:'user', content: userPrompt},
      ],
    }),
  });
  const data = await resp.json();
  if(data.error) throw new Error(data.error.message || 'API-Fehler');
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
}

// Prüft eine einzelne Antwort EINER SELBST ERFUNDENEN KATEGORIE per ChatGPT:
// true = passt zur Kategorie, false = passt nicht,
// null = Prüfung technisch fehlgeschlagen (z.B. Netzwerk/CORS)
async function aiCheckAnswer(categoryLabel, letter, answer){
  if(!aiConfigured) return true;
  const sys = 'Du bewertest Antworten im Spiel Stadt-Land-Fluss. Antworte ausschließlich mit kompaktem JSON im Format {"valid": true} oder {"valid": false}. Kein Fließtext, kein Markdown.';
  const user = `Kategorie: "${categoryLabel}"\nGeforderter Anfangsbuchstabe: "${letter}"\nAntwort des Spielers: "${answer}"\n\nIst dies ein echtes, existierendes Beispiel für die Kategorie "${categoryLabel}", das mit "${letter}" beginnt?`;
  try{
    const text = await callChatGPT(sys, user, 40);
    const match = text.match(/\{[^}]*\}/);
    if(!match) return null;
    return !!JSON.parse(match[0]).valid;
  }catch(e){ console.error('KI-Prüfung fehlgeschlagen', e); return null; }
}

// Erstellt einen kurzen KI-Kommentar zur fertigen Runden-Rangliste
async function aiRoundComment(rId, letter, perPlayer, players){
  if(!aiConfigured) return;
  const order = Object.keys(perPlayer).sort((a,b)=>perPlayer[b].total-perPlayer[a].total);
  const lines = order.map(id=>`${(players[id]||{}).name||'?'}: ${perPlayer[id].total} Punkte`).join('\n');
  const sys = 'Du bist ein launiger Spielleiter für Stadt-Land-Fluss. Antworte NUR mit einem einzigen kurzen, witzigen Satz auf Deutsch (max. 20 Wörter). Kein JSON, keine Anführungszeichen, kein Markdown.';
  const user = `Buchstabe der Runde: ${letter}\nErgebnisse:\n${lines}\n\nSchreib einen kurzen, launigen Kommentar zu dieser Runde.`;
  try{
    const comment = (await callChatGPT(sys, user, 60)).trim();
    if(comment) await roomRef(`results/${rId}/comment`).set(comment);
  }catch(e){ console.error('KI-Kommentar fehlgeschlagen', e); }
}

views.create = ()=>{
  const wrap = el(`
    <div>
      <div class="paper">
        <h1 class="title">Spiel erstellen</h1>
        <p class="sub">Dein Name und die Kategorien.</p>
        <div class="field">
          <label class="field-label">Dein Name</label>
          <input type="text" id="name" placeholder="z. B. Mia" maxlength="18">
        </div>
        <div class="field">
          <label class="field-label">Kategorien</label>
          <div class="chips" id="chips"></div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <input type="text" id="customCat" placeholder="eigene Kategorie…" maxlength="16" style="font-size:16px;">
            <button class="link-btn" id="addCat" style="white-space:nowrap;">+ hinzufügen</button>
          </div>
        </div>
        <div class="error" id="err" style="display:none;"></div>
        <button class="btn btn-primary" id="create">Raum öffnen</button>
      </div>
    </div>
  `);

  function drawChips(){
    const box = wrap.querySelector('#chips'); box.innerHTML='';
    ALL_CATEGORIES.concat(state.customCats).forEach(c=>{
      const on = state.selectedCats.includes(c.id);
      const chip = el(`<div class="chip ${on?'on':''} ${c.core?'locked':''}">${c.label}</div>`);
      chip.onclick=()=>{
        if(c.core) return;
        if(on) state.selectedCats = state.selectedCats.filter(x=>x!==c.id);
        else state.selectedCats.push(c.id);
        drawChips();
      };
      box.appendChild(chip);
    });
  }
  drawChips();

  wrap.querySelector('#addCat').onclick=()=>{
    const input = wrap.querySelector('#customCat');
    const label = input.value.trim();
    if(!label) return;
    const id = 'c_'+label.toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'').slice(0,12);
    state.customCats.push({id,label});
    state.selectedCats.push(id);
    input.value='';
    drawChips();
  };

  wrap.querySelector('#create').onclick = async ()=>{
    const name = wrap.querySelector('#name').value.trim();
    const errBox = wrap.querySelector('#err');
    const btn = wrap.querySelector('#create');
    errBox.style.display='none';
    if(!configReady){ errBox.textContent='Firebase ist noch nicht eingerichtet (siehe Hinweis oben).'; errBox.style.display='block'; return; }
    if(!name){ errBox.textContent='Bitte Namen eingeben.'; errBox.style.display='block'; return; }

    state.name = name;
    state.isHost = true;
    const allCats = ALL_CATEGORIES.concat(state.customCats);
    state.categories = state.selectedCats.map(id=>allCats.find(c=>c.id===id));

    btn.disabled=true; btn.textContent='Erstelle Raum…';

    const roomId = 'slf-' + Math.random().toString(36).slice(2, 7);
    state.roomId = roomId;
    state.room = {
      hostId: state.myId,
      hostName: name,
      categories: state.categories,
      usedLetters: [],
      roundId: 0,
      letter: '',
      active: false,
      ended: false,
      players: { [state.myId]: {id: state.myId, name} },
      results: {},
    };
    state.players = state.room.players;

    try{
      await roomRef('meta').set(roomMetaPayload());
    }catch(e){
      btn.disabled=false; btn.textContent='Raum öffnen';
      errBox.textContent='Verbindung zum Speicher fehlgeschlagen: ' + (e && e.message ? e.message : 'unbekannter Fehler') + '. Prüfe firebaseConfig und die Datenbank-Regeln.';
      errBox.style.display='block';
      return;
    }

    state.view = 'lobby';
    render();
    setConn(true, 'Host aktiv (verbunden)');
    attachListeners();
  };

  return wrap;
};

views.play = ()=>{
  state.fieldStatus = {};
  Object.values(state.fieldTimers||{}).forEach(t=>clearTimeout(t));
  state.fieldTimers = {};

  const wrap = el(`
    <div>
      <div class="paper">
        <div class="letter-wrap"><div class="letter-tile">${state.room.letter}</div></div>
        ${!aiConfigured ? `<p class="status-line" style="font-size:11px; margin-top:-10px;">KI-Prüfung nicht eingerichtet — es wird nur der Anfangsbuchstabe geprüft.</p>` : ''}
        <table class="cats">
          ${state.categories.map(c=>`
            <tr><td class="lbl">${c.label}</td><td>
              <input type="text" data-cat="${c.id}" placeholder="…" autocomplete="off">
              <div class="field-status" data-status="${c.id}"></div>
            </td></tr>
          `).join('')}
        </table>
        <button class="btn btn-stop" id="stop" disabled>Stopp!</button>
      </div>
    </div>
  `);

  const stopBtn = wrap.querySelector('#stop');
  function updateStopState(){
    stopBtn.disabled = !state.categories.every(c => state.fieldStatus[c.id]==='valid');
  }
  function setStatus(catId, status, msg){
    state.fieldStatus[catId] = status;
    const box = wrap.querySelector(`.field-status[data-status="${catId}"]`);
    if(box){
      box.textContent = msg || '';
      box.style.color = status==='valid' ? '#2f6b3f' : status==='invalid' ? 'var(--pencil-red)' : 'var(--ink-soft)';
    }
    updateStopState();
  }

  wrap.querySelectorAll('input[data-cat]').forEach(inp=>{
    const catId = inp.dataset.cat;
    inp.value = state.answers[catId] || '';
    setStatus(catId, 'invalid', '');

    inp.addEventListener('input', ()=>{
      state.answers[catId] = inp.value;
      if(state.fieldTimers[catId]) clearTimeout(state.fieldTimers[catId]);
      const val = inp.value;
      const letter = norm(state.room.letter);
      const nv = norm(val);

      if(!nv || !letter || nv[0]!==letter[0]){
        setStatus(catId, 'invalid', nv ? ('beginnt nicht mit ' + state.room.letter) : '');
        return;
      }
      if(!aiConfigured){
        setStatus(catId, 'valid', '✓');
        return;
      }
      setStatus(catId, 'checking', 'prüfe…');
      state.fieldTimers[catId] = setTimeout(async ()=>{
        const cat = state.categories.find(c=>c.id===catId);
        const ok = await aiCheckAnswer(cat.label, state.room.letter, val);
        if(state.answers[catId] !== val) return; // Text hat sich inzwischen geändert
        if(ok === true) setStatus(catId, 'valid', '✓ passt');
        else if(ok === false) setStatus(catId, 'invalid', '✗ passt nicht zur Kategorie');
        else setStatus(catId, 'valid', '⚠️ KI nicht erreichbar — nur Buchstabe geprüft');
      }, 700);
    });
  });

  stopBtn.onclick = async ()=>{
    stopBtn.disabled = true; stopBtn.textContent = 'Gestoppt…';
    state.submittedRounds[state.room.roundId] = true;
    state.lastRenderedRound = state.room.roundId;
    state.view = 'results';
    render();
    await roomRef(`submissions/${state.room.roundId}/${state.myId}`).set({answers: state.answers});
  };
  return wrap;
};

};

function buildResults(wrap){
  const roundId = state.room.roundId;
  const result = state.room.results && state.room.results[roundId];
  const box = wrap.querySelector('#roundBox');
  if(!result || !result.perPlayer){
    box.innerHTML = `<p class="status-line">Berechne Punkte…</p>`;
  } else {
    const order = Object.keys(result.perPlayer).sort((a,b)=>{
      const pa = result.perPlayer[a], pb = result.perPlayer[b];
      if(!!pa.pending !== !!pb.pending) return pa.pending ? 1 : -1;
      return pb.total - pa.total;
    });
    const comment = result.comment ? `<p class="sub" style="font-style:italic; margin-top:-8px;">🤖 ${result.comment}</p>` : '';
    const provisionalNote = !result.complete ? `<p class="status-line" style="margin:4px 0 14px;">Vorläufige Rangliste — nicht alle fertig</p>` : '';
    box.innerHTML = `<h1 class="title">Runde ${roundId} — Buchstabe ${state.room.letter}</h1>${comment}${provisionalNote}` +
      order.map((id,i)=>{
        const r = result.perPlayer[id];
        const nm = (state.players[id]||{}).name || '?';
        if(r.pending){
          return `<div class="result-row"><div class="rank">–</div><div class="rname">${nm}<div class="breakdown">noch nicht abgegeben</div></div><div class="rpts">…</div></div>`;
        }
        const bd = state.categories.map(c=>`${c.label}: ${r.perCategory[c.id]||0}`).join(' · ');
        return `<div class="result-row ${i===0 && result.complete?'first':''}"><div class="rank">${i+1}</div><div class="rname">${nm}<div class="breakdown">${bd}</div></div><div class="rpts">${r.total} Pkt</div></div>`;
      }).join('');
  }
  buildTotals(wrap.querySelector('#totalBox'), false);
}

function buildTotals(box, isFinal){
  const results = state.room.results || {};
  const totals = {};
  Object.keys(state.players).forEach(id=>totals[id]=0);
  Object.values(results).forEach(r=>{
    Object.keys(r.perPlayer||{}).forEach(id=>{ totals[id]=(totals[id]||0)+r.perPlayer[id].total; });
  });
  const order = Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);
  box.innerHTML = `<h1 class="title">${isFinal?'Endstand':'Gesamtrangliste'}</h1>` +
    order.map((id,i)=>{
      const nm = (state.players[id]||{}).name || '?';
      return `<div class="result-row ${i===0?'first':''}"><div class="rank">${i+1}</div><div class="rname">${nm}</div><div class="rpts">${totals[id]} Pkt</div></div>`;
    }).join('');
}

/* ---------- Meta-Objekt, das der Host in der DB pflegt ---------- */
function roomMetaPayload(){
  return {
    hostId: state.room.hostId,
    hostName: state.room.hostName,
    categories: state.room.categories,
    usedLetters: state.room.usedLetters,
    roundId: state.room.roundId,
    letter: state.room.letter,
    active: state.room.active,
    ended: state.room.ended,
    players: state.room.players,
  };
}

function applyMeta(meta){
  state.room.hostId = meta.hostId;
  state.room.hostName = meta.hostName;
  state.room.categories = meta.categories;
  state.room.usedLetters = meta.usedLetters || [];
  state.room.roundId = meta.roundId;
  state.room.letter = meta.letter;
  state.room.active = meta.active;
  state.room.ended = meta.ended;
  state.room.players = meta.players || {};
  state.players = state.room.players;
  state.categories = meta.categories || state.categories;
}

async function hostStartRound(){
  if(!Array.isArray(state.room.usedLetters)) state.room.usedLetters = [];
  let pool = LETTER_POOL.filter(l=>!state.room.usedLetters.includes(l));
  if(pool.length===0){ state.room.usedLetters=[]; pool = LETTER_POOL.slice(); }
  const letter = pool[Math.floor(Math.random()*pool.length)];
  state.room.usedLetters.push(letter);
  state.room.letter = letter;
  state.room.roundId++;
  state.room.active = true;
  // gezielt nur diese Felder aktualisieren, damit die zuletzt
  // eingetragenen "players" (von Mitspielern geschrieben) nicht
  // überschrieben werden
  await roomRef('meta').update({
    usedLetters: state.room.usedLetters,
    letter: state.room.letter,
    roundId: state.room.roundId,
    active: true,
  });
}

function calculateResults(rId, subs, allPlayerIds){
  const submittedIds = Object.keys(subs);
  const letter = norm(state.room.letter);
  const perPlayer = {};
  allPlayerIds.forEach(id=>{
    perPlayer[id] = submittedIds.includes(id)
      ? {perCategory:{}, total:0, pending:false}
      : {perCategory:{}, total:0, pending:true};
  });

  state.room.categories.forEach(cat=>{
    const valid = {};
    submittedIds.forEach(id=>{
      const val = norm((subs[id] && subs[id].answers && subs[id].answers[cat.id]) || '');
      if(val && letter && val[0]===letter[0]) valid[id]=val;
    });
    const counts = {};
    Object.values(valid).forEach(v=>{ counts[v]=(counts[v]||0)+1; });
    submittedIds.forEach(id=>{
      let pts = 0;
      if(valid[id]) pts = counts[valid[id]]===1 ? 10 : 5;
      perPlayer[id].perCategory[cat.id]=pts;
      perPlayer[id].total += pts;
    });
  });

  return {perPlayer, complete: submittedIds.length === allPlayerIds.length};
}

/* ---------- Echtzeit-Listener statt Polling ---------- */
function attachListeners(){
  roomRef('meta').on('value', snap=>{
    const meta = snap.val();
    if(!meta){ setConn(false, state.isHost ? 'Fehler beim Speichern' : 'Host nicht erreichbar'); return; }
    setConn(true);
    applyMeta(meta);
    syncView();
  });

  roomRef('submissions').on('value', snap=>{
    state.submissionsCache = snap.val() || {};
    syncView();
  });

  roomRef('results').on('value', snap=>{
    state.room.results = snap.val() || {};
    syncView();
  });
}

function syncView(){
  if(!state.roomId) return;

  if(state.room.ended){
    if(state.view!=='ended'){ state.view='ended'; render(); }
    else if(document.getElementById('finalBox')) buildTotals(document.getElementById('finalBox'), true);
    return;
  }

  if(!state.room.active){
    if(state.view==='lobby') renderPlayerList(document.getElementById('playerList'));
    return;
  }

  const rId = state.room.roundId;
  const subs = (state.submissionsCache && state.submissionsCache[rId]) || {};
  const someoneStopped = Object.keys(subs).length > 0;

  // Falls jemand anderes schon "Stopp" gedrückt hat, aktuellen Stand automatisch mit einreichen
  if(someoneStopped && !state.submittedRounds[rId] && state.view==='play'){
    state.submittedRounds[rId] = true;
    roomRef(`submissions/${rId}/${state.myId}`).set({answers: state.answers})
      .catch(()=>{ delete state.submittedRounds[rId]; });
  }

  // Host: Rangliste live nachrechnen, sobald mindestens eine Einsendung da ist
  // (nicht erst wenn alle fertig sind) - dadurch gibt es keinen "Warte..."-Screen,
  // sondern sofort eine (ggf. vorläufige) Rangliste, die sich live aktualisiert.
  if(state.isHost && someoneStopped){
    const allIds = Object.keys(state.room.players);
    const computed = calculateResults(rId, subs, allIds);
    const sig = JSON.stringify(computed);
    if(state.lastResultsSignature[rId] !== sig){
      state.lastResultsSignature[rId] = sig;
      roomRef(`results/${rId}`).update({perPlayer: computed.perPlayer, complete: computed.complete});
    }
    if(computed.complete && !state.commentRequested[rId]){
      state.commentRequested[rId] = true;
      aiRoundComment(rId, state.room.letter, computed.perPlayer, state.room.players);
    }
  }

  if(someoneStopped){
    // Immer neu rendern: die Rangliste soll live mitwachsen, sobald
    // weitere Spieler abgeben oder der KI-Kommentar eintrifft.
    state.lastRenderedRound = rId;
    state.view = 'results';
    render();
  } else {
    if(state.view!=='play' || state.lastRenderedRound!==rId){
      state.lastRenderedRound = rId;
      state.answers = {};
      state.view='play';
      render();
    }
  }
}

render();
</script>
